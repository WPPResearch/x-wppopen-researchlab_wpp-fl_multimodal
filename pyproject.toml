[project]
name = "multimodal-fl-framework"
version = "0.1.0"
description = "Multimodal Federated Learning Project"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "flwr>=1.26.1",
    "flwr-datasets[vision]>=0.6.0",
    "torch>=2.13.0",
    "torchvision>0.25.0",
    "wandb==0.25.1",
    "numpy<2",
    "scikit-learn==1.6.1",
    "pydantic>=2.10.5,<3.0.0",
    "pydantic-settings>=2.7.1,<3.0.0",
    "loguru>=0.7.3,<0.8.0",
    "click>=8.3.3,<9.0.0",
    "yq>=3.4.3,<4.0.0",
    "PyYAML>=6.0.1,<7.0.0",
    "polars>=1.38.1,<2.0.0",
    "google-genai>=1.62.0,<2.0.0",
    "google-cloud-aiplatform>=1.133.0",
    "google-cloud-storage>=3.0.0",
    "vertexai",
    "ray>=2.56.0",
    "fastapi",
    "starlette>=1.0.1",
    "python-dotenv>=1.2.1,<2.0.0",
    "fastparquet>=2025.12.0,<2026.0.0",
    "optuna>=4.7.0,<5.0.0",
    "optuna-dashboard>=0.20.0,<0.21.0",
    "skorch>=1.3.1,<2.0.0",
    "pandas-stubs>=3.0.0,<3.1.0",
    "pandas>=2.2.0,<3.0.0",
    "google-auth>=2.22.0,<3.0.0",
    "Werkzeug>=3.0.0",
    "msgpack==1.2.1",
]

[project.scripts]
simulation = "scripts.run_simulation:simulate"
encode-dataset = "scripts.encode_dataset:main"
partition-dataset = "scripts.partition_dataset:main"
infer-fed-model = "scripts.infer_fed_model:main"

[dependency-groups]
dev = [
    "pre-commit>=4.1.0,<5.0.0",
]

[tool.uv]
package = true
override-dependencies = [
    "cryptography>=48.0.1",
    "setuptools==83.0.0",
    "pyasn1==0.6.4",
]

[tool.uv.sources]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "scripts"]